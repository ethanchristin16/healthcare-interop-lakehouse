[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hc-lakehouse"
version = "0.1.0"
description = "HL7 v2, FHIR R4 and X12 835 into bronze/silver/gold tables with PHI-safe keys and data-quality gates (synthetic data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4", "pyarrow>=14"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hc-lakehouse = "hc_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
